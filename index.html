<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>Under construction | Felipe Quiroz</title>
<meta name="description" content="A refreshed portfolio is on the way.">
<link rel="canonical" href="https://felipequirozp.cl/">
<link rel="alternate" hreflang="en" href="https://felipequirozp.cl/">
<link rel="alternate" hreflang="es" href="https://felipequirozp.cl/es/">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07090d;--fg:#f4f5f7;--muted:#8c95a3;--line:#242b34;--blue:#6799ff}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{background:var(--bg)}
body{min-height:100svh;background:radial-gradient(ellipse 85% 80% at 90% -25%,rgba(51,64,90,.16),transparent 65%),var(--bg);color:var(--fg);font:400 14px/1.65 Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.page{min-height:100svh;width:min(calc(100% - 136px),1392px);margin:auto;display:flex;flex-direction:column}
header{height:94px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-family:"DM Sans",Inter,sans-serif;font-weight:650;letter-spacing:-.065em;font-size:21px}
.lang{display:flex;gap:13px;align-items:center;color:#a3adbc;font-size:12px}
.lang a{padding:5px 1px;transition:color .2s}
.lang a:hover{color:white}
.lang .sep{height:13px;width:1px;background:#404753}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:87px 0 110px}
.eyebrow{color:#9ca7b7;display:flex;align-items:center;gap:12px;font-weight:600;font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.pulse{display:inline-block;position:relative;width:8px;height:8px;background:var(--blue);border-radius:50%;flex:none}
.pulse:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(103,153,255,.37);border-radius:50%;animation:pulse 2.6s ease-out infinite}
h1{font-family:"DM Sans",Inter,sans-serif;font-size:clamp(54px,8vw,120px);font-weight:500;letter-spacing:-.073em;line-height:1.06;max-width:1130px;margin:36px 0 30px;text-wrap:balance}
h1 span{color:#929ba9}
.intro{font-size:clamp(15px,1.48vw,19px);line-height:1.82;color:#abb3bf;max-width:570px;margin:0}
.bottom-info{margin-top:75px;max-width:650px;border-top:1px solid #313744;display:flex;align-items:center;justify-content:space-between;gap:23px;padding-top:23px}
.status{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.08em;color:#98a3b4;text-transform:uppercase;white-space:nowrap}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.bar{width:170px;height:2px;background:#27303c;overflow:hidden;position:relative;border-radius:8px}
.bar:after{content:"";position:absolute;inset:0 auto 0 0;width:36%;background:#9cbbff;border-radius:8px;animation:slide 3s ease-in-out infinite alternate}
.mail{display:inline-flex;align-items:center;gap:11px;color:#d6dce5;font-size:12px;border-bottom:1px solid #687589;padding-bottom:5px;transition:color .2s}
.mail:hover{color:#fff}
.mail svg{width:15px;height:15px;transition:transform .2s}
.mail:hover svg{transform:translate(2px,-2px)}
footer{min-height:81px;display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--line);color:#727d8d;font-size:11px}
.place{display:inline-flex;align-items:center;gap:9px}
.place:before{content:"";height:6px;width:6px;border-radius:50%;background:var(--blue)}
@keyframes pulse{0%{transform:scale(.55);opacity:.85}100%{transform:scale(1.8);opacity:0}}
@keyframes slide{0%{transform:translateX(-10%)}100%{transform:translateX(195%)}}
@media(max-width:700px){.page{width:calc(100% - 40px)}header{height:77px}.brand{font-size:19px}main{padding:92px 0 100px}h1{font-size:clamp(52px,11.5vw,78px);margin:31px 0 25px}.eyebrow{font-size:10px}.intro{font-size:15px}.bottom-info{margin-top:62px;flex-wrap:wrap}.bar{flex:1;min-width:90px}.mail{width:max-content}footer{padding:22px 0;align-items:flex-start;flex-direction:column;gap:7px}}
@media(max-width:380px){h1{font-size:49px}.bottom-info{gap:16px}.status{white-space:normal}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="page">
<header><span class="brand">Felipe Quiroz<span style="color:var(--blue)">.</span></span><nav class="lang" aria-label="Language"><a href="/" aria-current="page">EN</a><span class="sep"></span><a href="/es/" >ES</a></nav></header>
<main>
<div class="eyebrow"><span class="pulse"></span>PORTFOLIO / WORK IN PROGRESS</div>
<h1>Something better<br><span>is taking shape.</span></h1>
<p class="intro">I'm rebuilding this space to better showcase the work, ideas and projects ahead. See you soon.</p>
<div class="bottom-info"><div class="status">REDESIGN IN PROGRESS</div><div class="bar" aria-hidden="true"></div><a class="mail" href="mailto:felipe@lowsignal.cl">Get in touch <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div>
</main>
<footer><span>© 2026 Felipe Quiroz.</span><span class="place">Built in Santiago, Chile.</span></footer>
</div>
</body></html>

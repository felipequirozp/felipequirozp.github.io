name: Add USM selected project
on:
  push:
    paths:
      - '.github/workflows/add-usm-selected-project.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Engineering 2030 section to USM pages
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'usm.html': {
              'marker': '/usm/engineering-2030/',
              'section': '''<section class="section soft"><div class="shell reveal"><div class="kicker">Selected project</div><h2>Engineering 2030</h2><div class="usm-project"><div class="usm-project-media"><img src="/images/usm-admissions-team-san.jpg" alt="Engineering 2030 at Universidad Técnica Federico Santa María"></div><div class="usm-project-copy"><div class="usm-project-meta">Strategy · Innovation · Higher education · 2024</div><p>A university-wide strategic initiative focused on modernizing engineering education, strengthening innovation capabilities and connecting academia, technology and industry.</p><a class="usm-project-link" href="/usm/engineering-2030/">View project ↗</a></div></div></div></section>'''
            },
            'es/usm.html': {
              'marker': '/es/usm/ingenieria-2030/',
              'section': '''<section class="section soft"><div class="shell reveal"><div class="kicker">Proyecto destacado</div><h2>Ingeniería 2030</h2><div class="usm-project"><div class="usm-project-media"><img src="/images/usm-admissions-team-san.jpg" alt="Ingeniería 2030 en la Universidad Técnica Federico Santa María"></div><div class="usm-project-copy"><div class="usm-project-meta">Estrategia · Innovación · Educación superior · 2024</div><p>Una iniciativa estratégica a nivel universitario enfocada en modernizar la formación en ingeniería, fortalecer capacidades de innovación y conectar academia, tecnología e industria.</p><a class="usm-project-link" href="/es/usm/ingenieria-2030/">Ver proyecto ↗</a></div></div></div></section>'''
            }
          }

          css = '''.usm-project{display:grid;grid-template-columns:.9fr 1.1fr;gap:42px;align-items:center;margin-top:30px;padding:18px;border:1px solid #dbe2e8;border-radius:20px;background:#fff}.usm-project-media{overflow:hidden;border-radius:14px;background:#e6edf3}.usm-project-media img{width:100%;aspect-ratio:16/10;object-fit:cover}.usm-project-copy{padding:8px 18px 8px 4px}.usm-project-meta{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}.usm-project-copy p{margin:16px 0 0}.usm-project-link{display:inline-flex;margin-top:18px;padding-bottom:2px;border-bottom:1px solid rgba(11,17,23,.22);font-size:10px;font-weight:700;transition:.18s}.usm-project-link:hover{color:var(--blue);border-color:var(--blue);transform:translateX(3px)}@media(max-width:900px){.usm-project{grid-template-columns:1fr}.usm-project-copy{padding:4px 4px 10px}}'''

          for fn, data in files.items():
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              if data['marker'] not in s:
                  if '.closing{' not in s:
                      raise SystemExit(f'CSS anchor missing in {fn}')
                  s=s.replace('.closing{', css + '.closing{', 1)
                  anchor='<section class="closing">'
                  if anchor not in s:
                      raise SystemExit(f'Closing anchor missing in {fn}')
                  s=s.replace(anchor, data['section'] + anchor, 1)
                  p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usm.html es/usm.html
          git commit -m "Add Engineering 2030 to USM page"
          git push

name: Apply home source refresh once

on:
  push:
    paths:
      - '.github/workflows/home-source-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update home source files
        run: |
          python - <<'PY'
          from pathlib import Path

          for path, es in [('index.html', False), ('es/index.html', True)]:
              p = Path(path)
              s = p.read_text()

              if es:
                  s = s.replace('Construyo productos, sistemas de growth y compañías.', 'Construyo compañías, productos y sistemas de crecimiento.')
                  s = s.replace('Construyo productos, sistemas de crecimiento y compañías.', 'Construyo compañías, productos y sistemas de crecimiento.')
                  s = s.replace('Producto · Growth · Operaciones · Company building', 'Company building · Producto · Growth · Tecnología')
              s = s.replace('Product Manager<br>2026 — Present — Present', 'Product Manager<br>2026 — Present')
              s = s.replace('Product Manager<br>2026 — Presente — Presente', 'Product Manager<br>2026 — Presente')

              mobile_css = '''<style id="home-mobile-how-fix">
              @media(max-width:700px){
                .how{padding:68px 20px!important}
                .how-head{display:grid!important;grid-template-columns:1fr!important;gap:24px!important;align-items:start!important}
                .how-head h2{font-size:clamp(34px,10vw,44px)!important;line-height:1.04!important;margin-top:12px!important}
                .how-head p{font-size:12px!important;line-height:1.72!important;max-width:none!important}
                .how .principles{display:block!important;margin-top:30px!important;border-top:1px solid rgba(255,255,255,.16)!important;border-bottom:0!important}
                .how .principle,.how .principle+.principle{padding:22px 0!important;border-left:0!important;border-bottom:1px solid rgba(255,255,255,.16)!important}
                .how .principle strong{font-size:18px!important;line-height:1.25!important}
                .how .principle span{margin-top:8px!important;font-size:11px!important;line-height:1.65!important}
              }
              </style>'''
              if 'id="home-mobile-how-fix"' not in s:
                  s = s.replace('</head>', mobile_css + '</head>')

              if es:
                  title_css = '''<style id="spanish-hero-title-spacing">
                  .hero h1{line-height:1.055!important}
                  @media(max-width:700px){.hero h1{line-height:1.08!important}}
                  </style>'''
                  if 'id="spanish-hero-title-spacing"' not in s:
                      s = s.replace('</head>', title_css + '</head>')

              scroll_css = '''<style id="home-scroll-reveals">
              .scroll-reveal{opacity:0;transform:translateY(24px);transition:opacity .7s cubic-bezier(.2,.65,.3,1),transform .7s cubic-bezier(.2,.65,.3,1);will-change:opacity,transform}
              .scroll-reveal.is-visible{opacity:1;transform:none}
              .scroll-reveal.delay-1{transition-delay:.06s}.scroll-reveal.delay-2{transition-delay:.12s}.scroll-reveal.delay-3{transition-delay:.18s}
              @media(prefers-reduced-motion:reduce){.scroll-reveal{opacity:1!important;transform:none!important;transition:none!important}}
              </style>'''
              if 'id="home-scroll-reveals"' not in s:
                  s = s.replace('</head>', scroll_css + '</head>')

              scroll_js = '''<script id="home-scroll-reveal-script">
              (()=>{
                const targets=[...document.querySelectorAll('.section-head,.projects-head,.how-head,.ideas-strip .ideas>div:first-child,.closing-inner>div:first-child,.work-row,.project,.how .principle,.idea-links .ideas-link')];
                targets.forEach((el,i)=>{el.classList.add('scroll-reveal');if(i%3===1)el.classList.add('delay-1');if(i%3===2)el.classList.add('delay-2')});
                if(!('IntersectionObserver' in window)){targets.forEach(el=>el.classList.add('is-visible'));return;}
                const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target)}}),{threshold:.12,rootMargin:'0px 0px -8% 0px'});
                targets.forEach(el=>observer.observe(el));
              })();
              </script>'''
              if 'id="home-scroll-reveal-script"' not in s:
                  s = s.replace('</body>', scroll_js + '</body>')

              p.write_text(s)
          PY
      - name: Commit source changes
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add index.html es/index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Polish home motion and Spanish spacing"
          git push

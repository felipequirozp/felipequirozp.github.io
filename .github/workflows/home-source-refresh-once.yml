name: Apply home source refresh once

on:
  push:
    paths:
      - '.github/workflows/home-source-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add visual previews to home project cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          configs = {
              'index.html': [
                  ('/tethered/virtual-school-explorer', '/images/explorador-grafica.png', 'Virtual School Explorer preview'),
                  ('/lowsignal/low-workspace', '/images/panel-demo.png', 'Low Workspace dashboard preview'),
                  ('/geovictoria/shift-optimizer', '/images/geo-shift-optimizer.webp', 'Shift Optimizer interface preview'),
              ],
              'es/index.html': [
                  ('/es/tethered/explorador-virtual-colegios', '/images/explorador-grafica.png', 'Vista previa del Explorador Virtual de Colegios'),
                  ('/es/lowsignal/low-workspace', '/images/panel-demo.png', 'Vista previa de Low Workspace'),
                  ('/es/geovictoria/shift-optimizer', '/images/geo-shift-optimizer.webp', 'Vista previa de Shift Optimizer'),
              ],
          }

          project_css = '''<style id="home-project-visuals">
          .project{padding:0 28px 28px!important;overflow:hidden!important;min-height:410px!important}
          .project-media{position:relative;margin:0 -28px 22px;aspect-ratio:16/10;overflow:hidden;background:#dfe7ed;border-bottom:1px solid #d1dbe4}
          .project-media img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .35s cubic-bezier(.2,.65,.3,1)}
          .project:hover .project-media img{transform:scale(1.035)}
          .project-media .project-index{position:absolute;top:16px;left:16px;z-index:2;margin:0;padding:7px 10px;border-radius:12px;background:rgba(11,17,23,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:rgba(255,255,255,.92)!important;font-size:38px!important;line-height:1!important;text-shadow:0 1px 8px rgba(0,0,0,.12)}
          .project small{margin-top:0!important}
          @media(max-width:1000px){.project{min-height:auto!important}.project-media{aspect-ratio:16/9}}
          @media(max-width:700px){.project{padding:0 22px 24px!important}.project-media{margin:0 -22px 20px;aspect-ratio:16/10}.project-media .project-index{top:14px;left:14px;font-size:32px!important}}
          </style>'''

          for path, cards in configs.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              for href, img, alt in cards:
                  pattern = rf'(<a class="project" href="{re.escape(href)}"><div>)<div class="project-index">(\d+)</div>'
                  repl = rf'\1<div class="project-media"><img src="{img}" alt="{alt}" loading="lazy"><div class="project-index">\2</div></div>'
                  s, _ = re.subn(pattern, repl, s, count=1)
              if 'id="home-project-visuals"' not in s:
                  s = s.replace('</head>', project_css + '</head>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source changes
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add index.html es/index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Add visual previews to home project cards"
          git push

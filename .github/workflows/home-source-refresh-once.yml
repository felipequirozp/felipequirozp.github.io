name: Apply home source refresh once

on:
  push:
    paths:
      - '.github/workflows/home-source-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update home source files
        run: |
          python - <<'PY'
          from pathlib import Path

          for path, es in [('index.html', False), ('es/index.html', True)]:
              p = Path(path)
              s = p.read_text()

              if es:
                  s = s.replace('Construyo productos, sistemas de growth y compañías.', 'Construyo compañías, productos y sistemas de crecimiento.')
                  s = s.replace('Construyo productos, sistemas de crecimiento y compañías.', 'Construyo compañías, productos y sistemas de crecimiento.')
                  s = s.replace('Producto · Growth · Operaciones · Company building', 'Company building · Producto · Growth · Tecnología')
              s = s.replace('Product Manager<br>2026 — Present — Present', 'Product Manager<br>2026 — Present')
              s = s.replace('Product Manager<br>2026 — Presente — Presente', 'Product Manager<br>2026 — Presente')

              mobile_css = '''<style id="home-mobile-how-fix">
              @media(max-width:700px){
                .how{padding:68px 20px!important}
                .how-head{display:grid!important;grid-template-columns:1fr!important;gap:24px!important;align-items:start!important}
                .how-head h2{font-size:clamp(34px,10vw,44px)!important;line-height:1.04!important;margin-top:12px!important}
                .how-head p{font-size:12px!important;line-height:1.72!important;max-width:none!important}
                .how .principles{display:block!important;margin-top:30px!important;border-top:1px solid rgba(255,255,255,.16)!important;border-bottom:0!important}
                .how .principle,.how .principle+.principle{padding:22px 0!important;border-left:0!important;border-bottom:1px solid rgba(255,255,255,.16)!important}
                .how .principle strong{font-size:18px!important;line-height:1.25!important}
                .how .principle span{margin-top:8px!important;font-size:11px!important;line-height:1.65!important}
              }
              </style>'''
              if 'id="home-mobile-how-fix"' not in s:
                  s = s.replace('</head>', mobile_css + '</head>')

              p.write_text(s)
          PY
      - name: Commit source changes
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add index.html es/index.html
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Polish Spanish hero and mobile how section"
          git push

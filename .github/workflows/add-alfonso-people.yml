name: Add Alfonso to People
on:
  push:
    paths:
      - '.github/scripts/add_alfonso_people.py'
      - '.github/workflows/add-alfonso-people.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Alfonso next to Ignacio
        run: python .github/scripts/add_alfonso_people.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          git commit -m "Add Alfonso to People"
          git push

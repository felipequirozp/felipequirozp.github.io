name: Add Anotate project cards

on:
  push:
    paths:
      - '.github/scripts/add_anotate_project_cards.py'
      - '.github/workflows/add-anotate-project-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch project pages
        run: python .github/scripts/add_anotate_project_cards.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          git commit -m "Add Anotate en la Lista cards in English and Spanish"
          git push

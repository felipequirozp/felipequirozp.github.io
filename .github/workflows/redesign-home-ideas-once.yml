# trigger-v3
name: Apply latest writing home section once

on:
  push:
    paths:
      - '.github/workflows/redesign-home-ideas-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace ideas section with latest writing in EN and ES
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css = '''<style id="home-latest-writing">
          .ideas-strip{padding:76px var(--page)!important;background:linear-gradient(180deg,#eef3f7 0%,#e7edf2 100%)!important;border-top:1px solid #dbe3e9!important}
          .latest-head{display:flex!important;align-items:end!important;justify-content:space-between!important;gap:30px!important;margin-bottom:24px!important}
          .latest-head h2{margin:14px 0 0!important;font-family:Manrope,sans-serif!important;font-size:clamp(34px,3.7vw,50px)!important;line-height:1.05!important;letter-spacing:-.045em!important;font-weight:500!important}
          .latest-all{display:inline-flex!important;align-items:center!important;gap:8px!important;padding:11px 14px!important;border:1px solid #ccd6df!important;border-radius:999px!important;background:#fff!important;font-size:10px!important;font-weight:700!important;transition:.2s!important;white-space:nowrap!important}
          .latest-all:hover{background:#0b1117!important;color:#fff!important;border-color:#0b1117!important;transform:translateY(-1px)!important}
          .latest-grid{display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr)!important;gap:18px!important}
          .latest-lead,.latest-side{overflow:hidden!important;border:1px solid #d7e0e7!important;border-radius:22px!important;background:#fff!important;transition:transform .22s ease,box-shadow .22s ease!important}
          .latest-lead:hover,.latest-side:hover{transform:translateY(-4px)!important;box-shadow:0 18px 40px rgba(27,49,70,.08)!important}
          .latest-lead-image{display:block!important;aspect-ratio:16/8.7!important;overflow:hidden!important;background:#e7ebef!important}
          .latest-lead-image img,.latest-side-image img{width:100%!important;height:100%!important;object-fit:cover!important;transition:transform .3s ease!important}
          .latest-lead:hover img,.latest-side:hover img{transform:scale(1.018)!important}
          .latest-lead-copy{padding:24px 26px 28px!important}
          .latest-meta,.latest-side-copy small{font-size:9px!important;font-weight:700!important;letter-spacing:.1em!important;text-transform:uppercase!important;color:#718399!important}
          .latest-lead h3{margin:12px 0 10px!important;max-width:760px!important;font-family:Manrope,sans-serif!important;font-size:clamp(28px,2.8vw,40px)!important;line-height:1.05!important;letter-spacing:-.043em!important;font-weight:500!important}
          .latest-lead p{margin:0!important;max-width:700px!important;color:var(--muted)!important;font-size:12px!important;line-height:1.7!important}
          .latest-side-stack{display:grid!important;grid-template-rows:1fr 1fr!important;gap:18px!important}
          .latest-side{position:relative!important;min-height:0!important;background:#0b1117!important}
          .latest-side-image{position:absolute!important;inset:0!important}
          .latest-side-image img{filter:brightness(.58)!important}
          .latest-side-copy{position:relative!important;z-index:2!important;height:100%!important;padding:22px!important;display:flex!important;flex-direction:column!important;justify-content:flex-end!important;background:linear-gradient(to top,rgba(5,7,10,.9),rgba(5,7,10,.16) 62%,transparent)!important}
          .latest-side-copy small{color:#b9c5d0!important}
          .latest-side h3{margin:9px 0 0!important;color:#fff!important;font-family:Manrope,sans-serif!important;font-size:22px!important;line-height:1.06!important;letter-spacing:-.04em!important;font-weight:500!important}
          @media(max-width:1050px){.latest-grid{grid-template-columns:1fr!important}.latest-side-stack{grid-template-columns:1fr 1fr!important;grid-template-rows:none!important}.latest-side{min-height:260px!important}}
          @media(max-width:700px){.ideas-strip{padding:58px 20px!important}.latest-head{align-items:flex-start!important;flex-direction:column!important}.latest-head h2{font-size:34px!important}.latest-side-stack{grid-template-columns:1fr!important}.latest-side{min-height:240px!important}.latest-lead-copy{padding:21px 22px 24px!important}.latest-lead h3{font-size:30px!important}}
          </style>'''

          blocks = {
            'index.html': '''<section class="ideas-strip"><div class="shell"><div class="latest-head"><div><div class="kicker">Latest writing</div><h2>Notes from what I’m building and learning.</h2></div><a class="latest-all" href="/blog">View all posts ↗</a></div><div class="latest-grid"><article class="latest-lead"><a class="latest-lead-image" href="/blog/my-everyday-stack"><img src="/images/apps5.jpg" alt="Five apps in Felipe Quiroz’s everyday stack" loading="lazy"></a><div class="latest-lead-copy"><div class="latest-meta">Tools / Productivity · October 2026</div><h3><a href="/blog/my-everyday-stack">My everyday stack: five apps I use to build and grow</a></h3><p>Five tools I use to organize ideas, think through problems, turn concepts into prototypes and keep projects moving.</p></div></article><div class="latest-side-stack"><article class="latest-side"><a class="latest-side-image" href="/blog/scaling-technology-without-losing-speed"><img src="/images/tech-founders-ama-buk-2026.jpg" alt="Tech Founders AMA at Buk in Santiago" loading="lazy"></a><div class="latest-side-copy"><small>Technology / Product</small><h3><a href="/blog/scaling-technology-without-losing-speed">Scaling technology without losing speed</a></h3></div></article><article class="latest-side"><a class="latest-side-image" href="/blog/ai-native-core"><img src="/images/platanus-event.jpg" alt="AI Native Startups event" loading="lazy"></a><div class="latest-side-copy"><small>AI / Product</small><h3><a href="/blog/ai-native-core">The next product leap is built with AI at the core</a></h3></div></article></div></div></div></section>''',
            'es/index.html': '''<section class="ideas-strip"><div class="shell"><div class="latest-head"><div><div class="kicker">Últimos artículos</div><h2>Notas sobre lo que estoy construyendo y aprendiendo.</h2></div><a class="latest-all" href="/es/blog">Ver todos los artículos ↗</a></div><div class="latest-grid"><article class="latest-lead"><a class="latest-lead-image" href="/es/blog/mi-stack-diario"><img src="/images/apps5.jpg" alt="Cinco apps del stack diario de Felipe Quiroz" loading="lazy"></a><div class="latest-lead-copy"><div class="latest-meta">Herramientas / Productividad · Octubre 2026</div><h3><a href="/es/blog/mi-stack-diario">Mi stack de todos los días: 5 apps para construir y crecer</a></h3><p>Cinco herramientas que uso para ordenar ideas, pensar problemas, crear prototipos y mantener los proyectos en movimiento.</p></div></article><div class="latest-side-stack"><article class="latest-side"><a class="latest-side-image" href="/es/blog/escalar-tecnologia-sin-perder-velocidad"><img src="/images/tech-founders-ama-buk-2026.jpg" alt="Tech Founders AMA en Buk, Santiago" loading="lazy"></a><div class="latest-side-copy"><small>Tecnología / Producto</small><h3><a href="/es/blog/escalar-tecnologia-sin-perder-velocidad">Escalar tecnología sin perder velocidad</a></h3></div></article><article class="latest-side"><a class="latest-side-image" href="/es/blog/ai-native-core"><img src="/images/platanus-event.jpg" alt="Evento AI Native Startups" loading="lazy"></a><div class="latest-side-copy"><small>IA / Producto</small><h3><a href="/es/blog/ai-native-core">El próximo salto de producto se construye con IA en el centro</a></h3></div></article></div></div></div></section>'''
          }

          for path, block in blocks.items():
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              s, n = re.subn(r'<section class="ideas-strip">.*?</section>(?=<section class="closing">)', block, s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Ideas section not found in {path}')
              if 'id="home-latest-writing"' not in s:
                  s = s.replace('</head>', css + '</head>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit source changes
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add index.html es/index.html
          git commit -m "Replace home ideas section with latest writing" || exit 0
          git push

name: Rename Engineering 2030 card

on:
  push:
    paths:
      - '.github/workflows/rename-engineering-2030-card.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify Engineering 2030 project titles
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('projects.html'): (
                  '<h3>Engineering 2030 · Strategy & Innovation</h3>',
                  '<h3>Engineering 2030</h3>',
              ),
              Path('es/projects.html'): (
                  '<h3>Ingeniería 2030 · Estrategia e Innovación</h3>',
                  '<h3>Ingeniería 2030</h3>',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected title not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          git commit -m "Simplify Engineering 2030 project titles"
          git push

name: Build Projects section

on:
  push:
    paths:
      - '.github/scripts/build_projects_section.py'
      - '.github/workflows/build-projects-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Projects section
        run: python .github/scripts/build_projects_section.py
      - name: Commit Projects changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Replace Now with Projects and add case studies"
          git push

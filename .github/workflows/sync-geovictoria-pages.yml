name: Sync GeoVictoria EN ES
on:
  push:
    paths:
      - '.github/scripts/sync_geovictoria_pages.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/sync_geovictoria_pages.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geovictoria.html es/geovictoria.html
          git commit -m "Sync GeoVictoria redesigned pages"
          git push

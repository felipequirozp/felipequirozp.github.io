name: Polish People cards

on:
  push:
    paths:
      - '.github/scripts/polish_people_cards.py'
      - '.github/workflows/polish-people-cards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/polish_people_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          git diff --cached --quiet || git commit -m "Normalize People portraits and simplify profile cards"
          git push

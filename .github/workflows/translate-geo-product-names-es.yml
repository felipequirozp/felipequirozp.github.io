name: Translate GeoVictoria product names ES
on:
  push:
    paths:
      - '.github/scripts/translate_geo_product_names_es.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/translate_geo_product_names_es.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es .github/scripts/build_projects_section_v2.py .github/scripts/sync_geovictoria_pages.py
          git commit -m "Translate GeoVictoria product names in Spanish"
          git push

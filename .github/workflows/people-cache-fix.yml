name: People final cache fix
on:
  push:
    paths:
      - '.github/workflows/people-cache-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch People HTML
        run: |
          perl -0pi -e 's/José Domingo Errázuriz/Domingo Errázuriz/g; s#mobile-nav\.js\?v=[^"'"' ]+#mobile-nav.js?v=20261101i#g' people.html es/people.html
      - name: Commit changes
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add people.html es/people.html
          git commit -m "Rename Domingo and refresh People script" || exit 0
          git push

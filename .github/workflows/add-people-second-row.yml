name: Apply final People portrait fix

on:
  push:
    paths:
      - '.github/workflows/add-people-second-row.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch People HTML and JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          style = '''<style id="people-final-visual-v7">
.people-all img[alt="Alejandra Mustakis"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(.95) translateY(4%)!important}
.people-all img[alt="Domingo Errázuriz"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(.95) translateY(4%)!important}
.people-all img[alt="Javier Robledo"]{transform:scale(1.34) translateY(10%)!important}
.people-all img[alt="Jorge Muñoz"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(1.06) translateY(0)!important}
.people-all img[alt="Lía Morice"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(1.03) translateY(0)!important}
</style>'''

          for filename in ['people.html','es/people.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<style id="people-final-visual-v\d+">.*?</style>\s*', '', text, flags=re.S)
              text = text.replace('</head>', style + '\n</head>', 1)
              text = re.sub(r'<script src="/mobile-nav\.js(?:\?v=[^"]*)?" defer></script>', '<script src="/mobile-nav.js?v=20261101n" defer></script>', text)
              path.write_text(text, encoding='utf-8')

          js = Path('mobile-nav.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace("['José Espinosa','/images/jose-manual.png'", "['José Espinosa','/images/Jose-espinosa.png'")
          text = re.sub(r"const tune=document\.createElement\('style'\);tune\.id='people-portrait-tuning-v\d+';tune\.textContent=`.*?`;document\.head\.appendChild\(tune\);", "const tune=document.createElement('style');tune.id='people-portrait-tuning-v7';tune.textContent=`.people-all img[alt=\"Alejandra Mustakis\"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(.95) translateY(4%)!important}.people-all img[alt=\"Domingo Errázuriz\"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(.95) translateY(4%)!important}.people-all img[alt=\"Javier Robledo\"]{transform:scale(1.34) translateY(10%)!important}.people-all img[alt=\"Jorge Muñoz\"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(1.06) translateY(0)!important}.people-all img[alt=\"Lía Morice\"]{object-fit:contain!important;object-position:center bottom!important;transform:scale(1.03) translateY(0)!important}`;document.head.appendChild(tune);", text, flags=re.S)
          text = text.replace('20261101k', '20261101n').replace('20261101m', '20261101n')
          js.write_text(text, encoding='utf-8')
          PY
      - name: Commit final People changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html mobile-nav.js
          git diff --cached --quiet || git commit -m "Apply final People portrait fix"
          git push

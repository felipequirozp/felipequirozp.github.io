name: Add People second row

on:
  push:
    paths:
      - '.github/scripts/add_people_second_row.py'
      - '.github/workflows/add-people-second-row.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_people_second_row.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          git diff --cached --quiet || git commit -m "Add Valentina, Tomas, Tamara and Ignacio to People"
          git push

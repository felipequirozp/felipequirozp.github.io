name: People visual final
on:
  push:
    paths:
      - '.github/workflows/people-visual-final.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final People visual alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          style = '''<style id="people-final-visual-v5">
.people-all img[alt="Alejandra Mustakis"]{transform:translateY(6%)!important;object-position:center 34%!important}
.people-all img[alt="Domingo Errázuriz"]{transform:translateY(5%)!important;object-position:center 33%!important}
.people-all img[alt="Javier Robledo"]{transform:scale(1.30) translateY(9%)!important}
.people-all img[alt="Jorge Muñoz"]{transform:scale(1.18) translateY(6%)!important;object-position:center 36%!important}
.people-all img[alt="Lía Morice"]{transform:scale(1.16) translateY(7%)!important;object-position:center 36%!important}
</style>'''

          for path in [Path('people.html'), Path('es/people.html')]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('José Domingo Errázuriz', 'Domingo Errázuriz')
              text = re.sub(r'<style id="people-final-visual-v\d+">.*?</style>\s*', '', text, flags=re.S)
              text = text.replace('</head>', style + '\n</head>', 1)
              text = re.sub(r'<script src="/mobile-nav\.js(?:\?v=[^"]*)?" defer></script>', '<script src="/mobile-nav.js?v=20261101j" defer></script>', text)
              path.write_text(text, encoding='utf-8')

          js = Path('mobile-nav.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace("['José Domingo Errázuriz','/images/domingo-e.png'", "['Domingo Errázuriz','/images/domingo-e.png'")
          text = text.replace('img[alt="José Domingo Errázuriz"]', 'img[alt="Domingo Errázuriz"]')
          text = re.sub(
              r"const tune=document\.createElement\('style'\);tune\.id='people-portrait-tuning-v4';tune\.textContent=`.*?`;document\.head\.appendChild\(tune\);",
              "const tune=document.createElement('style');tune.id='people-portrait-tuning-v5';tune.textContent=`.people-all img[alt=\"Alejandra Mustakis\"]{transform:translateY(6%)!important;object-position:center 34%!important}.people-all img[alt=\"Domingo Errázuriz\"]{transform:translateY(5%)!important;object-position:center 33%!important}.people-all img[alt=\"Javier Robledo\"]{transform:scale(1.30) translateY(9%)!important}.people-all img[alt=\"Jorge Muñoz\"]{transform:scale(1.18) translateY(6%)!important;object-position:center 36%!important}.people-all img[alt=\"Lía Morice\"]{transform:scale(1.16) translateY(7%)!important;object-position:center 36%!important}`;document.head.appendChild(tune);",
              text,
              flags=re.S
          )
          js.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html mobile-nav.js
          git commit -m "Align final People portraits" || exit 0
          git push
# trigger v2

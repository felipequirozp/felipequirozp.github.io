name: Update Alfonso People card

on:
  push:
    paths:
      - '.github/scripts/update_alfonso_people.py'
      - '.github/workflows/update-alfonso-people.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update Alfonso card
        run: python .github/scripts/update_alfonso_people.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          git commit -m "Update Alfonso in People"
          git push

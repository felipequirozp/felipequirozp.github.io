name: Normalize Engineering 2030 typography
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/normalize-engineering-2030-typography.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize EN and ES case-study scale
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('usm/engineering-2030/index.html'),
              Path('es/usm/ingenieria-2030/index.html'),
          ]

          replacements = {
              '.hero{padding:54px var(--page) 60px': '.hero{padding:62px var(--page) 72px',
              '.hero-logo{height:44px;': '.hero-logo{height:40px;',
              '.hero h1{margin:70px 0 0;max-width:1240px;font-family:Manrope,sans-serif;font-size:clamp(54px,6.3vw,96px);line-height:1.01;letter-spacing:-.06em;font-weight:500}': '.hero h1{margin:34px 0 0;max-width:880px;font-family:Manrope,sans-serif;font-size:clamp(42px,4.25vw,62px);line-height:1.04;letter-spacing:-.052em;font-weight:500}',
              '.hero-bottom{margin-top:46px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.55fr);gap:72px;align-items:start}': '.hero-bottom{margin-top:30px;display:grid;grid-template-columns:1fr .42fr;gap:70px;align-items:end}',
              '.hero-copy{max-width:950px;color:#5f6d7a;font-size:16px;line-height:1.72}': '.hero-copy{max-width:820px;color:#5f6d7a;font-size:14px;line-height:1.82}',
              '.role{padding-left:30px;': '.role{padding-left:20px;',
              '.role strong{display:block;font-family:Manrope,sans-serif;font-size:22px;': '.role strong{display:block;font-family:Manrope,sans-serif;font-size:20px;',
              '.section{padding:84px var(--page)}': '.section{padding:82px var(--page)}',
              'h2{margin:14px 0 22px;font-family:Manrope,sans-serif;font-size:clamp(38px,4vw,58px);line-height:1.06;letter-spacing:-.05em;font-weight:500}': 'h2{margin:18px 0 24px;font-family:Manrope,sans-serif;font-size:clamp(34px,3.7vw,50px);line-height:1.06;letter-spacing:-.045em;font-weight:500}',
              '.card h3{margin:16px 0 10px;font-family:Manrope,sans-serif;font-size:23px;': '.card h3{margin:16px 0 10px;font-family:Manrope,sans-serif;font-size:21px;',
              '.hero h1{margin-top:30px;font-size:42px;line-height:1.02}': '.hero h1{margin-top:26px;font-size:40px;line-height:1.02}',
          }

          for path in paths:
              text = path.read_text()
              original = text
              for old, new in replacements.items():
                  if old not in text:
                      raise SystemExit(f'Missing expected CSS in {path}: {old[:80]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)
              print(f'Updated {path}')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usm/engineering-2030/index.html es/usm/ingenieria-2030/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Normalize Engineering 2030 case-study typography'
          git push

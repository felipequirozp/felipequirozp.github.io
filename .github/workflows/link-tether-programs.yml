name: Link Tether selected projects
on:
  push:
    paths:
      - '.github/scripts/link_tether_programs.py'
      - '.github/workflows/link-tether-programs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/link_tether_programs.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tethereducation.html es/tethereducation.html
          git commit -m "Make Tether selected projects clickable"
          git push
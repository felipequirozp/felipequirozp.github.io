name: Apply portfolio patches

on:
  push:
    paths:
      - '.github/workflows/tighten-login-crop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify all navbars
        run: python .github/scripts/unify_all_navbars.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'es/**/*.html' 'lowsignal/**/*.html' 'tethered/**/*.html' 2>/dev/null || true
          git add -u
          git commit -m "Unify navbar across portfolio"
          git push

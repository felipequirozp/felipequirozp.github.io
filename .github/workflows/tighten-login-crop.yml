name: Apply portfolio patches

on:
  push:
    paths:
      - '.github/workflows/tighten-login-crop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Round Low Workspace preview
        run: python .github/scripts/round_low_workspace_preview.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lowsignal.html es/lowsignal.html
          git commit -m "Round Low Workspace preview"
          git push

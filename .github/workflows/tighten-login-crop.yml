name: Tighten Low Workspace login crop

on:
  push:
    paths:
      - '.github/workflows/tighten-login-crop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tighter login crop
        run: python .github/scripts/tighten_login_crop.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lowsignal/low-workspace.html es/lowsignal/low-workspace.html
          git commit -m "Tighten Low Workspace login crop"
          git push

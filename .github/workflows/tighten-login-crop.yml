name: Apply portfolio patches

on:
  push:
    paths:
      - '.github/workflows/tighten-login-crop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reposition home navigation
        run: python .github/scripts/reposition-home-nav.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html es/index.html
          git commit -m "Reposition home navigation"
          git push

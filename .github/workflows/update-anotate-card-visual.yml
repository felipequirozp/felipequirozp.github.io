name: Update Anotate card visual

on:
  push:
    paths:
      - '.github/scripts/update_anotate_card_visual.py'
      - '.github/workflows/update-anotate-card-visual.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update project cards
        run: python .github/scripts/update_anotate_card_visual.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          git commit -m "Use public registry visual for Anotate project card"
          git push

name: Reorder selected project cards

on:
  push:
    paths:
      - '.github/scripts/reorder_selected_projects.py'
      - '.github/workflows/reorder-selected-projects.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reorder cards
        run: python .github/scripts/reorder_selected_projects.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          git commit -m "Reorder Low Workspace Anotate and GeoVictoria projects"
          git push

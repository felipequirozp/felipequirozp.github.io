name: Fix People source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite People cards in source HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          remove_names = ['Damián Aldunate','Matías Bussinger']
          people = [
              ('Pablo Hormazábal','/images/pablo-h.png','https://cl.linkedin.com/in/pablohormazabaloyarzo'),
              ('Gonzalo Zunino','/images/gonzalo.png','https://cl.linkedin.com/in/gonzalozuninop'),
              ('María Ignacia Gana','/images/ignacia-trabun.png','https://cl.linkedin.com/in/maria-ignacia-gana-tocornal-a6a650117'),
              ('José Manuel Parodi','/images/jose-manual.png','https://cl.linkedin.com/in/jos%C3%A9-manuel-parodi-cruzat-5b075a1ba'),
              ('Alejandra Mustakis','/images/ale-mustakis.png','https://cl.linkedin.com/in/alejandramustakis'),
              ('José Domingo Errázuriz','/images/domingo-e.png','https://www.linkedin.com/in/jose-domingo-errazuriz/'),
              ('José Espinosa','/images/jose-manual.png','https://www.linkedin.com/in/joserespinosar/'),
          ]
          tail_people = [
              ('Jorge Muñoz','/images/people/jorge-munoz.webp','https://www.linkedin.com/in/jorgemunozve'),
              ('Lía Morice','/images/people/lia-morice.webp','https://www.linkedin.com/in/l%C3%ADa-morice-b31521419'),
          ]
          def card(name, img, href):
              return f'<article class="person"><a class="card-link" href="{href}" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile"></a><div class="portrait"><div class="portrait-inner"><img src="{img}?v=20261101g" alt="{name}" loading="lazy"></div></div><div class="person-copy"><h3>{name}</h3></div></article>'
          alignment_style = '<style id="people-final-alignment-v3">\n.people-all img[alt="Pablo Hormazábal"]{object-position:center 36%!important;transform:translateY(11%)!important}\n.people-all img[alt="Gonzalo Zunino"],\n.people-all img[alt="María Ignacia Gana"],\n.people-all img[alt="José Manuel Parodi"],\n.people-all img[alt="Alejandra Mustakis"],\n.people-all img[alt="José Domingo Errázuriz"],\n.people-all img[alt="José Espinosa"]{transform:translateY(9%)!important}\n</style>'
          for file in [Path('people.html'), Path('es/people.html')]:
              text = file.read_text(encoding='utf-8')
              managed = remove_names + [p[0] for p in people] + [p[0] for p in tail_people]
              for name in managed:
                  pattern = re.compile(r'<article class="person(?: is-visible)?">(?:(?!<article class="person).)*?<h3>'+re.escape(name)+r'</h3>(?:(?!<article class="person).)*?</article>', re.S)
                  text = pattern.sub('', text)
              fran = re.search(r'<article class="person(?: is-visible)?">(?:(?!<article class="person).)*?<h3>Francisca Astudillo</h3>(?:(?!<article class="person).)*?</article>', text, re.S)
              if not fran:
                  raise SystemExit(f'Francisca Astudillo card not found in {file}')
              text = text[:fran.end()] + ''.join(card(*p) for p in people) + text[fran.end():]
              grid_end = '</div></div></section><section class="closing">'
              if grid_end not in text:
                  raise SystemExit(f'People grid end not found in {file}')
              text = text.replace(grid_end, ''.join(card(*p) for p in tail_people) + grid_end, 1)
              for name in remove_names:
                  text = re.sub(r'\.people-all img\[alt="'+re.escape(name)+r'"\]\{[^\n]*\}\n?', '', text)
              text = re.sub(r'<style id="people-final-alignment-v\d+">.*?</style>\s*', '', text, flags=re.S)
              text = re.sub(r'<style id="people-final-position-v\d+">.*?</style>\s*', '', text, flags=re.S)
              text = text.replace('</head>', alignment_style + '\n</head>', 1)
              text = re.sub(r'<script src="/mobile-nav\.js(?:\?v=[^"]*)?" defer></script>', '<script src="/mobile-nav.js?v=20261101g" defer></script>', text)
              file.write_text(text, encoding='utf-8')
          PY
      - name: Commit source HTML fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Finalize People order and portrait alignment"
            git push
          fi

name: Add About education line

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-about-education.yml

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update About pages
        shell: bash
        run: |
          python -c "from pathlib import Path; pages={Path('about.html'):('Education','Commercial Engineering — UTFSM · YC Startup School ’25'),Path('es/about.html'):('Educación','Ingeniería Comercial — UTFSM · YC Startup School ’25')}; css='\\n    .education-meta{margin:24px 0 2px;color:var(--muted-2);font-size:12px;line-height:1.6}\\n    .education-meta span{margin-right:8px;color:#4d5865;font-weight:600}\\n'; needle='<a class=\\\"cv-button\\\"'; [(p.write_text((lambda h: h if 'class=\\\"education-meta\\\"' in h else h.replace('</style>',css+'\\n  </style>',1).replace(needle,f'<div class=\\\"education-meta\\\"><span>{label}</span>{text}</div>'+needle,1))(p.read_text(encoding='utf-8')),encoding='utf-8')) for p,(label,text) in pages.items()]"
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html es/about.html
          git diff --cached --quiet && exit 0
          git commit -m "Add education line to About"
          git push

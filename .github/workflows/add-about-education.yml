name: Add About education line

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-about-education.yml'

permissions:
  contents: write

jobs:
  update-about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add education metadata to About pages
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = {
              Path('about.html'): ('Education', 'Commercial Engineering — UTFSM · YC Startup School ’25'),
              Path('es/about.html'): ('Educación', 'Ingeniería Comercial — UTFSM · YC Startup School ’25'),
          }

          css = '''
    .education-meta{
      margin:24px 0 2px;
      color:var(--muted-2);
      font-size:12px;
      line-height:1.6;
    }
    .education-meta span{
      margin-right:8px;
      color:#4d5865;
      font-weight:600;
    }
'''

          for path, (label, text) in pages.items():
              html = path.read_text(encoding='utf-8')
              if 'class="education-meta"' in html:
                  continue

              if '.education-meta{' not in html:
                  html = html.replace('</style>', css + '\n  </style>', 1)

              block = f'<div class="education-meta"><span>{label}</span>{text}</div>'
              needle = '<a class="cv-button"'
              if needle not in html:
                  raise RuntimeError(f'CV button anchor not found in {path}')
              html = html.replace(needle, block + needle, 1)
              path.write_text(html, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html es/about.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add education line to About"
          git push

name: Refresh everyday stack article

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_stack_article.py'
      - '.github/workflows/refresh-stack-article.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh article
        run: python .github/scripts/refresh_stack_article.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/my-everyday-stack.html es/blog/mi-stack-diario.html
          git commit -m 'Refresh everyday stack article layout'
          git pull --rebase origin main
          git push

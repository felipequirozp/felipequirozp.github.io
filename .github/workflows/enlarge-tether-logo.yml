name: Enlarge Tether logo
on:
  push:
    paths:
      - '.github/scripts/enlarge_tether_logo.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/enlarge_tether_logo.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tethereducation.html es/tethereducation.html
          git commit -m "Increase Tether hero logo size"
          git push

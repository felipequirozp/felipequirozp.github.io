name: Final People alignment
on:
  push:
    paths:
      - '.github/workflows/final-people-alignment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch People pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('people.html'), Path('es/people.html')]
          style = '''<style id="people-final-alignment-v1">
.people-all img[alt="Pablo Hormazábal"]{transform:translateY(9%)!important}
.people-all img[alt="Gonzalo Zunino"],
.people-all img[alt="María Ignacia Gana"],
.people-all img[alt="José Manuel Parodi"],
.people-all img[alt="Alejandra Mustakis"],
.people-all img[alt="José Domingo Errázuriz"],
.people-all img[alt="José Espinosa"]{transform:translateY(8%)!important}
</style>'''

          jorge = '<article class="person"><a class="card-link" href="https://www.linkedin.com/in/jorgemunozve" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile"></a><div class="portrait"><div class="portrait-inner"><img src="/images/people/jorge-munoz.webp?v=20261101f" alt="Jorge Muñoz" loading="lazy"></div></div><div class="person-copy"><h3>Jorge Muñoz</h3></div></article>'
          lia = '<article class="person"><a class="card-link" href="https://www.linkedin.com/in/l%C3%ADa-morice-b31521419" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profile"></a><div class="portrait"><div class="portrait-inner"><img src="/images/people/lia-morice.webp?v=20261101f" alt="Lía Morice" loading="lazy"></div></div><div class="person-copy"><h3>Lía Morice</h3></div></article>'

          for path in files:
              text = path.read_text()
              text = re.sub(r'<style id="people-final-alignment-v1">.*?</style>\s*', '', text, flags=re.S)
              text = text.replace('</head>', style + '\n</head>')

              # Remove any stale copies so order is deterministic.
              for name in ['Jorge Muñoz','Lía Morice']:
                  text = re.sub(r'<article class="person">(?:(?!<article class="person">).)*?<h3>'+re.escape(name)+r'</h3>(?:(?!<article class="person">).)*?</article>', '', text, flags=re.S)

              anchor = '</div></div></section><section class="closing">'
              if anchor not in text:
                  raise SystemExit(f'Grid anchor not found in {path}')
              text = text.replace(anchor, jorge + lia + anchor, 1)
              text = text.replace('/mobile-nav.js?v=20261101e', '/mobile-nav.js?v=20261101f')
              text = text.replace('/mobile-nav.js"', '/mobile-nav.js?v=20261101f"')
              path.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add people.html es/people.html
          git commit -m "Align new People portraits and restore Jorge and Lía" || exit 0
          git push

name: Repair People grid

on:
  push:
    paths:
      - '.github/scripts/repair_people_grid.py'
      - '.github/workflows/repair-people-grid.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore last known-good People pages
        run: git checkout 00adf6e6692b9970dae01244c1190460ff3feed6 -- people.html es/people.html
      - name: Apply safe portrait replacements and alignment
        run: python .github/scripts/repair_people_grid.py
      - name: Commit repaired People pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          git diff --cached --quiet || git commit -m "Restore full People grid and align portraits"
          git push

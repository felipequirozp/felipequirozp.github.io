name: Apply Low Workspace block

on:
  push:
    paths:
      - '.github/workflows/apply-low-workspace.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Low Workspace block
        run: python .github/scripts/add_low_workspace.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lowsignal.html es/lowsignal.html
          git commit -m "Normalize Low Workspace feature in lowsignal case study"
          git push


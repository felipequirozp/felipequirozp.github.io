name: Fix Blog title color

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_blog_title_color.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply blog title color fix
        run: python .github/scripts/fix_blog_title_color.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.html es/blog.html
          git commit -m "Use one color for Blog hero title"
          git pull --rebase origin main
          git push origin main

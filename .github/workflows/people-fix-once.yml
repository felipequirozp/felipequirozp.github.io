name: People fix once
on:
  push:
    paths:
      - '.github/workflows/people-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply home closing height directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          closing_style = '''<style id="home-closing-height-v2">
.closing-inner{min-height:600px!important;padding:96px 0!important;align-items:end!important}
@media(max-width:1000px){.closing-inner{min-height:520px!important;padding:82px 0!important}}
@media(max-width:700px){.closing-inner{min-height:460px!important;padding:68px 0!important}}
</style>'''

          for filename in ['index.html','es/index.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'<style id="home-closing-height-v\d+">.*?</style>\s*', '', text, flags=re.S)
              text = text.replace('</head>', closing_style + '\n</head>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html es/index.html
          git commit -m "Increase home closing section height" || exit 0
          git push
# trigger home closing v2

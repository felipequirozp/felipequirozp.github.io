name: Restore wrapped home headings
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Restore wrapped home headings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous heading wrapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for filename in ['index.html','es/index.html']:
              path=Path(filename)
              text=path.read_text(encoding='utf-8')
              text=re.sub(r'<style id="home-wide-headings-v\d+">.*?</style>\s*','',text,flags=re.S)
              path.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add index.html es/index.html
          git diff --cached --quiet || git commit -m "Restore wrapped home headings layout"
          git push

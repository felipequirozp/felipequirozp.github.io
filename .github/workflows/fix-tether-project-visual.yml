name: Fix Tether project visual

on:
  push:
    paths:
      - '.github/scripts/fix_tether_project_visual.py'
      - '.github/workflows/fix-tether-project-visual.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Tether team image with product demo
        run: python .github/scripts/fix_tether_project_visual.py
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/build_projects_section_v2.py projects.html es/projects.html
          git commit -m "Use Virtual School Explorer demo in Projects"
          git push

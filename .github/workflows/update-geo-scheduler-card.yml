name: Update GeoVictoria Smart Scheduler card
on:
  push:
    paths:
      - '.github/scripts/update_geo_scheduler_card.py'
      - '.github/workflows/update-geo-scheduler-card.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/update_geo_scheduler_card.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geovictoria.html es/geovictoria.html
          git commit -m "Link Smart Scheduler case from GeoVictoria"
          git push

name: Apply taller home closing
on:
  push:
    branches: [main]
jobs:
  adjust:
    if: github.event.head_commit.message == 'Apply taller home closing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Increase closing height in EN and ES homes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          style='<style id="home-closing-height-v3">\n.closing-inner{min-height:600px!important;padding:96px 0!important;align-items:end!important}\n@media(max-width:1000px){.closing-inner{min-height:520px!important;padding:82px 0!important}}\n@media(max-width:700px){.closing-inner{min-height:460px!important;padding:68px 0!important}}\n</style>'
          for p in [Path('index.html'), Path('es/index.html')]:
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<style id="home-closing-height-v\d+">.*?</style>\s*','',s,flags=re.S)
              s=s.replace('</head>',style+'\n</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Felipe Quiroz"
          git config user.email "felipe@lowsignal.cl"
          git add index.html es/index.html
          git diff --cached --quiet || git commit -m "Increase home closing section height"
          git push
# trigger v3

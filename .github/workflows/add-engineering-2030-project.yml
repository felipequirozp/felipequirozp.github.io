name: Add Engineering 2030 project cards
on:
  push:
    paths:
      - '.github/workflows/add-engineering-2030-project.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Engineering 2030 cards
        run: |
          python - <<'PY'
          from pathlib import Path

          cards = {
            'projects.html': '''<a class="card reveal" data-cat="education product" href="/usm/engineering-2030/"><div class="visual"><img src="/images/usm-admissions-team-san.jpg" alt="Universidad Técnica Federico Santa María · Engineering 2030"></div><div class="body"><div class="meta"><span>Universidad Técnica Federico Santa María</span><span>2024</span></div><h3>Engineering 2030 · Strategy & Innovation</h3><p>Strategic transformation work connecting engineering education, emerging technology, innovation and industry needs.</p><div class="impact"><span>Strategy</span><span>Innovation</span><span>Higher education</span></div><span class="cta">View project ↗</span></div></a>''',
            'es/projects.html': '''<a class="card reveal" data-cat="education product" href="/es/usm/ingenieria-2030/"><div class="visual"><img src="/images/usm-admissions-team-san.jpg" alt="Universidad Técnica Federico Santa María · Ingeniería 2030"></div><div class="body"><div class="meta"><span>Universidad Técnica Federico Santa María</span><span>2024</span></div><h3>Ingeniería 2030 · Estrategia e Innovación</h3><p>Trabajo de transformación estratégica conectando formación en ingeniería, tecnología emergente, innovación y necesidades de la industria.</p><div class="impact"><span>Estrategia</span><span>Innovación</span><span>Educación superior</span></div><span class="cta">Ver proyecto ↗</span></div></a>'''
          }

          anchors = {
            'projects.html': '<a class="card reveal" data-cat="saas product" href="/geovictoria/shift-change-workflow/">',
            'es/projects.html': '<a class="card reveal" data-cat="saas product" href="/es/geovictoria/shift-change-workflow/">'
          }

          for path, card in cards.items():
              p = Path(path)
              text = p.read_text()
              href = '/usm/engineering-2030/' if path == 'projects.html' else '/es/usm/ingenieria-2030/'
              if f'href="{href}"' in text:
                  continue
              anchor = anchors[path]
              if anchor not in text:
                  raise SystemExit(f'Anchor not found in {path}')
              text = text.replace(anchor, card + '\n' + anchor, 1)
              p.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          if ! git diff --cached --quiet; then
            git commit -m "Add Engineering 2030 to selected projects"
            git push
          fi
name: Refresh portfolio cases

on:
  push:
    paths:
      - '.github/workflows/refresh-shift-optimizer-case.yml'
      - '.github/scripts/fix_home_project_arrow.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_home_project_arrow.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html es/index.html
          git diff --cached --quiet || git commit -m "Fix home project CTA arrow alignment"
          git push

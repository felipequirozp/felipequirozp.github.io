name: Refresh Shift Optimizer case

on:
  push:
    paths:
      - '.github/workflows/refresh-shift-optimizer-case.yml'
      - '.github/scripts/refresh_shift_optimizer_case.py'
      - '.github/scripts/add_geovictoria_logo_to_product_cases.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/refresh_shift_optimizer_case.py
      - run: python .github/scripts/add_geovictoria_logo_to_product_cases.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geovictoria/shift-optimizer.html es/geovictoria/shift-optimizer.html geovictoria/shift-change-workflow.html es/geovictoria/shift-change-workflow.html
          git diff --cached --quiet || git commit -m "Add GeoVictoria logo to product case heroes"
          git push

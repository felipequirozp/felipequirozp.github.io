name: Refresh portfolio cases

on:
  push:
    paths:
      - '.github/workflows/refresh-shift-optimizer-case.yml'
      - '.github/scripts/add_geovictoria_logo_to_product_cases.py'
      - '.github/scripts/update_lowsignal_title.py'
      - '.github/scripts/refresh_low_workspace_case.py'
      - '.github/scripts/fix_tether_home_logo.py'
      - '.github/scripts/refine_home_cadence.py'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_geovictoria_logo_to_product_cases.py
      - run: python .github/scripts/update_lowsignal_title.py
      - run: python .github/scripts/refresh_low_workspace_case.py
      - run: python .github/scripts/fix_tether_home_logo.py
      - run: python .github/scripts/refine_home_cadence.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geovictoria/shift-optimizer.html es/geovictoria/shift-optimizer.html geovictoria/shift-change-workflow.html es/geovictoria/shift-change-workflow.html lowsignal.html es/lowsignal.html lowsignal/low-workspace.html es/lowsignal/low-workspace.html index.html es/index.html
          git diff --cached --quiet || git commit -m "Refine portfolio home cadence"
          git push

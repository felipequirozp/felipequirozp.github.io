name: Add Engineering 2030 scroll reveal

on:
  push:
    paths:
      - '.github/workflows/add-engineering-2030-scroll-reveal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add subtle scroll reveal to Engineering 2030 cases
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('usm/engineering-2030/index.html'),
              Path('es/usm/ingenieria-2030/index.html'),
          ]

          css = '''\n.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}.reveal.is-visible{opacity:1;transform:none}@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}\n'''
          script = '''\n<script id="engineering-scroll-reveal">(()=>{const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver' in window)){els.forEach(el=>el.classList.add('is-visible'));return;}const io=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');io.unobserve(entry.target);}})},{threshold:.12,rootMargin:'0px 0px -40px 0px'});els.forEach(el=>io.observe(el));})();</script>\n'''

          for p in files:
              s = p.read_text()
              if 'engineering-scroll-reveal' in s:
                  continue
              s = s.replace('</style></head>', css + '</style></head>', 1)
              s = s.replace('<section class="section">', '<section class="section reveal">')
              s = s.replace('<section class="section alt">', '<section class="section alt reveal">')
              s = s.replace('<section class="media-wrap">', '<section class="media-wrap reveal">')
              s = s.replace('<section class="closing">', '<section class="closing reveal">')
              s = s.replace('</body>', script + '</body>', 1)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usm/engineering-2030/index.html es/usm/ingenieria-2030/index.html
          git commit -m "Add scroll reveal to Engineering 2030"
          git push

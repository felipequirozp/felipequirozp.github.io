name: Add lowsignal button hovers
on:
  push:
    paths:
      - '.github/scripts/add_lowsignal_button_hovers.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/add_lowsignal_button_hovers.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lowsignal.html es/lowsignal.html
          git commit -m "Polish lowsignal button hovers"
          git push

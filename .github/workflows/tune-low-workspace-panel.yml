name: Tune Low Workspace panel image

on:
  push:
    paths:
      - '.github/workflows/tune-low-workspace-panel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune panel image presentation
        run: python .github/scripts/tune_low_workspace_panel.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lowsignal/low-workspace.html es/lowsignal/low-workspace.html
          git commit -m "Refine Low Workspace panel image display"
          git push

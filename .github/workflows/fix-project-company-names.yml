name: Fix project company names

on:
  push:
    paths:
      - '.github/scripts/fix_project_company_names.py'
      - '.github/workflows/fix-project-company-names.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/fix_project_company_names.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          git diff --cached --quiet || git commit -m "Use natural company name casing in project cards"
          git push

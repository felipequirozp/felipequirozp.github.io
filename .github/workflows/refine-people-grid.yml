name: Refine People grid
on:
  push:
    paths:
      - '.github/scripts/refine_people_grid.py'
      - '.github/workflows/refine-people-grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply People grid refinement
        run: python .github/scripts/refine_people_grid.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html es/people.html
          git commit -m "Refine People grid and portrait styling"
          git push

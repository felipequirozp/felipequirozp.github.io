name: Preserve People portrait assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate curated People portraits
        run: |
          test -f images/people/valentina-gran.png
          test -f images/people/tamara-munoz.png
          test -f images/people/ignacio-lepe.png
          test -f images/people/tomas-recart.png
          echo "People portrait assets are curated manually and will not be overwritten."

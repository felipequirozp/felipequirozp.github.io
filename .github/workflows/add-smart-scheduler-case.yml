name: Add Smart Scheduler case study

on:
  push:
    paths:
      - '.github/scripts/add_smart_scheduler_case.py'
      - '.github/workflows/add-smart-scheduler-case.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Smart Scheduler case and project cards
        run: python .github/scripts/add_smart_scheduler_case.py
      - name: Commit generated pages
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html geovictoria/smart-scheduler.html es/geovictoria/smart-scheduler.html
          git commit -m "Add Smart Scheduler project case"
          git push

name: Redesign Low Workspace v2
on:
  push:
    paths:
      - '.github/scripts/redesign_low_workspace_v2.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/redesign_low_workspace_v2.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lowsignal/low-workspace.html es/lowsignal/low-workspace.html
          git commit -m "Redesign Low Workspace case study"
          git push

name: Tune Projects white canvas and Explorer video

on:
  push:
    paths:
      - '.github/scripts/tune_projects_white_video.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/tune_projects_white_video.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.html es/projects.html
          git diff --cached --quiet || git commit -m "Tune Projects white canvas and Explorer video"
          git push

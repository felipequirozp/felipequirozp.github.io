name: Apply global mobile navigation

on:
  push:
    paths:
      - '.github/workflows/apply-global-mobile-nav.yml'
      - '.github/scripts/apply_global_mobile_nav.py'
      - '.github/scripts/add_home_mountain_background.py'
      - 'mobile-nav.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python .github/scripts/apply_global_mobile_nav.py
      - run: python .github/scripts/add_home_mountain_background.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git diff --cached --quiet || git commit -m "Apply global mobile navigation and home mountain closing"
          git push
